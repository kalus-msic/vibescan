x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:16-alpine
    <<: *default-logging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    <<: *default-logging
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    <<: *default-logging
    command: >
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      python manage.py createsuperuser --noinput 2>/dev/null || true &&
      gunicorn vibescan.wsgi:application
      --bind 0.0.0.0:8000
      --workers 2
      --threads 2
      --max-requests 500
      --max-requests-jitter 50"
    volumes:
      - static_volume:/app/staticfiles
      - ./logs:/app/logs
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped

  celery:
    build: .
    <<: *default-logging
    command: celery -A vibescan worker --loglevel=info --concurrency=1
    volumes:
      - ./logs:/app/logs
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 2g
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    <<: *default-logging
    ports:
      - "9003:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - static_volume:/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  caddy_data:
  caddy_config:
